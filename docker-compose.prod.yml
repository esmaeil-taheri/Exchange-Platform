# ──────────────────────────────────────────────────────────────────────────────
# Production stack — app containers run a registry image built by CD,
# no source mounts, no runserver.
#
# Required on the server, next to this file:
#   - .env            (production values; DATABASE_HOST/REDIS_HOST are overridden below)
#   - nginx.conf
#
# BACKEND_IMAGE must point at the released image, e.g.:
#   BACKEND_IMAGE=ghcr.io/<owner>/<repo>:v1.2.3 \
#     docker compose -f docker-compose.prod.yml up -d
# (the CD workflow exports it automatically)
# ──────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - django_network

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASS}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "PING"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - django_network

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the released backend image}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
    volumes:
      - static_volume:/app/src/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - django_network

  celery:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the released backend image}
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "-E"]
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - django_network

  celery_beat:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the released backend image}
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "INFO",
              "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - django_network

  nginx:
    image: nginx:mainline-alpine3.23
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/var/www/static:ro
    depends_on:
      - backend
    networks:
      - django_network

volumes:
  postgres_data:
  redis_data:
  static_volume:

networks:
  django_network:
    driver: bridge
