name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Dummy values so config/settings/base.py (python-decouple) can import in CI.
# None of these ever reach a real service.
env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.8.2"
  SECRET_KEY: ci-only-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
  ALLOWED_HOSTS: ci.example.com
  CORS_ALLOWED_ORIGINS: https://ci.example.com
  DATABASE_HOST: 127.0.0.1
  DATABASE_PORT: "5432"
  DATABASE_NAME: gold_ci
  DATABASE_USER: postgres
  DATABASE_PASSWORD: postgres
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_PASS: ""
  CELERY_BROKER_URL: redis://127.0.0.1:6379/0
  SMS_IR_API_KEY: ci-dummy
  SEND_LOGIN_OTP_TEMPLATE_ID: "100000"
  SEND_MESSAGE_TEMPLATE_ID: "100000"
  INQUIRY_SERVICE_USERNAME: ci-dummy
  INQUIRY_SERVICE_PASSWORD: ci-dummy
  OBJECT_STORAGE_ACCESS_KEY: ci-dummy
  OBJECT_STORAGE_SECRET_KEY: ci-dummy
  OBJECT_STORAGE_ENDPOINT_URL: 127.0.0.1:9000
  ZARINPAL_MERCHANT_KEY: ci-dummy
  ZARINPAL_CALLBACK_URL: https://ci.example.com/api/v1/payments/callback
  VANDAR_API_KEY: ci-dummy
  VANDAR_BUSINESS_NAME: ci-dummy
  VANDAR_SETTLEMENT_WAGE: "6000"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # TODO: remove continue-on-error after the one-time cleanup:
    #   uv run ruff check --fix src && uv run ruff format src
    # (~80 lint errors and ~200 unformatted files exist today)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # ruff is pinned in the dev dependency group, so CI, pre-commit and
      # local runs all use the same version.
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check src

      - name: Ruff format check
        run: uv run ruff format --check src

  test-sqlite:
    name: Tests (SQLite + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # --locked fails if uv.lock has drifted from pyproject.toml, so a
      # forgotten `uv lock` is caught here rather than at image build time.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run test suite
        run: uv run pytest src/apps -q --cov=src --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  test-postgres:
    name: Tests (PostgreSQL — real locks + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gold_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Overrides the pyproject default (config.settings.test / SQLite).
      # Runs the real migration chain and real SELECT FOR UPDATE locks,
      # including the concurrency tests that SQLite skips.
      DJANGO_SETTINGS_MODULE: config.settings.test_postgres
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run test suite on PostgreSQL
        run: uv run pytest src/apps -q

  django-checks:
    name: Migration drift + deploy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: No missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Django deploy checks
        run: uv run python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DEBUG: "False"

  docker-build:
    name: Validate prod image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
